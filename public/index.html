<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Event card studio</title><link rel="stylesheet" href="/style.css"></head><body><main><small>OPEN TOOLS / NATIVE EDITION</small><h1>Event card studio</h1><p>Design a card and download a full-resolution PNG rendered by Skia.</p><section class="card"><form id="card-form"><label>Event title<input id="title" value="Community evening" maxlength="40" required></label><button>Render card</button></form></section><section class="card"><img id="card" alt="Your rendered invitation" src="/api/card?title=Community%20evening"><p><a id="download" href="/api/card?title=Community%20evening" download="invitation.png">Download PNG</a></p></section></main><script>document.querySelector('#card-form').onsubmit=e=>{e.preventDefault();const url='/api/card?title='+encodeURIComponent(document.querySelector('#title').value);document.querySelector('#card').src=url;document.querySelector('#download').href=url};</script></body></html>
